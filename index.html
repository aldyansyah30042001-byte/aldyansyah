<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Aldyansyah</title>
    <!-- Library CSS untuk desain modern kelas pakar -->
    <    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: sans-serif; overflow-x: hidden; margin: 0; }
        nav { padding: 24px; display: flex; justify-content: space-between; max-width: 1100px; margin: 0 auto; align-items: center; }
        header { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { color: #818cf8; margin: 0; font-size: 24px; font-weight: bold; }
        h2 { font-size: 50px; font-weight: 800; margin-bottom: 16px; letter-spacing: -1px; color: white; }
        p { color: #9ca3af; font-size: 20px; margin-bottom: 32px; }
        .btn { background-color: #4f46e5; color: white; font-weight: 600; padding: 12px 32px; border-radius: 9999px; text-decoration: none; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); display: inline-block; }
        .btn:hover { background-color: #4338ca; }
        .nav-links a { color: #9ca3af; text-decoration: none; margin-left: 24px; font-weight: 500; }
        .nav-links a:hover { color: #818cf8; }
        .highlight { color: #818cf8; }
    </style>

</head>
<body class="bg-gray-950 text-gray-100 font-sans overflow-x-hidden">

    <!-- Efek Ring Cahaya Mengikuti Kursor (Glow Effect) -->
    <div id="glow" class="fixed top-0 left-0 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none -translate-x-1/2 -translate-y-1/2 transition-all duration-300 ease-out z-0"></div>

    <!-- Navigasi Utama -->
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto relative z-10">
        <h1 class="text-xl font-bold text-indigo-400">&lt;Aldyansyah /&gt;</h1>
        <div class="space-x-6">
            <a href="#about" class="hover:text-indigo-400 transition">Tentang</a>
            <a href="#projects" class="hover:text-indigo-400 transition">Proyek</a>
        </div>
    </nav>

    <!-- Bagian Utama (Hero Section) -->
    <header class="h-[80vh] flex flex-col justify-center items-center text-center px-4 relative z-10">
        <h2 class="text-5xl md:text-7xl font-extrabold mb-4 tracking-tight">Halo, Saya <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500">Aldyansyah</span></h2>
        <p class="text-gray-400 text-lg max-w-md mb-8">Creative Developer & Tech Expert</p>
<a href="#projects" class="btn">Lihat Karya Saya</a>

<script>
        // Logika JavaScript Pelacak Kursor Mouse
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
